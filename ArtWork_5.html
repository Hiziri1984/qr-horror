<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> </title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #080706; color: #7a7065;
            font-family: serif; overflow-x: hidden;
            user-select: none;
        }

        .container {
            max-width: 500px; margin: 0 auto; padding: 40px 20px;
        }

        .cn-header {
            text-align: center; border-bottom: 2px solid #4a0d0d; padding-bottom: 15px; margin-bottom: 40px;
        }
        .cn-header h1 { color: #8c1c1c; font-size: 22px; margin: 0; letter-spacing: 4px; }

        /* ★ 画像が綺麗に中央に収まるようにCSSを調整 */
        .statue-box {
            width: 100%;
            height: auto;
            max-height: 350px;
            background-color: #000;
            border: 1px solid #2d1414;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #222;
            margin-bottom: 40px;
            overflow: hidden;
            padding: 10px;
            box-sizing: border-box;
        }
        .statue-box img {
            width: 100%;
            height: auto;
            max-height: 330px;
            object-fit: contain;
            display: block;
        }

        .story { font-size: 15px; line-height: 2.2; letter-spacing: 1px; }

        /* エラー用のスタイル */
        .curse-particle {
            position: fixed; pointer-events: none; z-index: 9999;
            color: #b30000; font-weight: bold; font-size: 28px;
            text-shadow: 0 0 8px rgba(0,0,0,1);
            animation: text-float 1.5s linear forwards;
        }
        @keyframes text-float {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(10deg); opacity: 0; }
        }

        /* システムエラー画面 */
        #error-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000; z-index: 100000; box-sizing: border-box; padding: 40px 20px;
            font-family: monospace; color: #ff3333; font-size: 14px; line-height: 1.8;
        }
        .error-box {
            border: 1px solid #ff3333; padding: 20px; background-color: #100000; box-shadow: 0 0 20px #500;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="cn-header">
            <h1>：「  」</h1>
        </div>

        <div class="statue-box">
            <img src="eyes.jpg" alt="作品画像">
        </div>

        <div class="story">
            <p>ここも</p>
        </div>
        
        <div style="height: 60vh;"></div>
    </div>

    <div id="error-overlay">
        <div class="error-box">
            <p>[CRITICAL_SYSTEM_ERROR] CODE: 0x004F6E</p>
            <p>----------------------------------------</p>
            <p>何者かによる視線を検知しました。</p>
            <p>決して目を合わせないでください。</p>
            <p>警告</p>
            <p>ブラウザを閉じてください</p>
            <p>----------------------------------------</p>
            <p>STATUS: DON'T LOOK AROUND</p>
        </div>
    </div>


    <audio id="glitch-sound" src="error_noise.mp3" preload="auto"></audio>

    <script>
        let isHacked = false;
        const errorOverlay = document.getElementById('error-overlay');
        const glitchSound = document.getElementById('glitch-sound');
        const words = ["冤", "留下来", "死期已至", "看見了", "命終"];

        window.addEventListener('scroll', function() {
            let maxScroll = document.body.offsetHeight - window.innerHeight;
            let currentScroll = window.scrollY;

            // スクロールが全体の半分（50%）
            if (currentScroll > maxScroll * 0.5 && !isHacked) {
                isHacked = true;
                startHacking();
            }
        });

        function startHacking() {
            // 音声再生とバイブ
            glitchSound.volume = 1.0;
            glitchSound.play().catch(() => {});
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 300, 50, 300]);

            // 1. 強制スクロール
            let glitchInterval = setInterval(() => {
                // 画面を揺さぶる
                let randomTarget = window.scrollY + (Math.random() > 0.5 ? 150 : -150);
                window.scrollTo(0, randomTarget);
            }, 30);

            // 2. 文字弾幕
            let textInterval = setInterval(() => {
                const span = document.createElement('span');
                span.className = 'curse-particle';
                span.innerText = words[Math.floor(Math.random() * words.length)];
                span.style.left = Math.random() * 80 + 10 + 'vw';
                document.body.appendChild(span);
                
                // 1.5秒後に生成した文字を消す
                setTimeout(() => span.remove(), 1500);
            }, 70);

            // 3. 偽のエラー画面
            setTimeout(() => {
                clearInterval(glitchInterval);
                clearInterval(textInterval);
                errorOverlay.style.display = 'block';
                
                if (navigator.vibrate) navigator.vibrate(2000);
            }, 3500);
        }
    </script>
</body>
</html>
