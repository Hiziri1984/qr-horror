<html lang="ja">
<head>

            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border-top: 4px solid #333;

        p {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .footer {
            margin-top: 50px;
            font-size: 12px;
            color: #999;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1></h1>
        <div class="author"></div>
        
        <p></p>
        
        <p</p>
        
        <div class="footer">

</html>
