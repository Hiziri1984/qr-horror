<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品解説：真夜中の抱擁</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            line-height: 1.8;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border-top: 4px solid #333;
            padding-top: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .author {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        p {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .footer {
            margin-top: 50px;
            font-size: 12px;
            color: #999;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>展示作品：『真夜中の抱擁』</h1>
        <div class="author">作者：不明（19世紀末頃）</div>
        
        <p>本作品は、作者が当時の凄惨な社会情勢から受けた精神的ストレスを具現化したものとされています。キャンバス中央に描かれた歪な影は、内面に潜む「未知の恐怖」の象徴です。</p>
        
        <p>繊細なタッチの中に、どこか見る者を不安にさせる技法が取り入れられており、当時の若手芸術家の間で高く評価されました。</p>
        
        <div class="footer">
            ※次の作品『黒い水鏡』の解説は、隣のQRコードを読み取ってください。
        </div>
    </div>
</body>
</html>
