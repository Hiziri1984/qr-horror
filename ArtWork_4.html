<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASE FILE: 03 - THE EVIL</title>
    <style>
        /* ーーー アメリカン・スプラッター風デザイン ーーー */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #eeeeee;
            /* ゴツゴツしたアメコミ・映画風のゴシック体 */
            font-family: 'Impact', 'Arial Black', sans-serif;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 50px 20px;
            box-sizing: border-box;
        }

        /* 映画のタイトルロゴ風ヘッダー */
        .us-header {
            text-align: center;
            border-top: 4px solid #990000;
            border-bottom: 4px solid #990000;
            padding: 15px 0;
            margin-bottom: 50px;
        }
        .us-header h1 {
            color: #e60000;
            font-size: 32px;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
        }
        .us-header .area-tag {
            font-size: 14px;
            color: #666;
            letter-spacing: 4px;
            margin-top: 5px;
        }

        /* 作品置き場 */
        .work-box {
            width: 100%;
            height: 280px;
            background-color: #111;
            border: 2px dashed #333;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #444;
            margin-bottom: 40px;
        }

        /* 解説文章（あえてフォントを少し普通にして油断させる） */
        .story-text {
            font-family: sans-serif;
            font-size: 16px;
            line-height: 2;
            color: #bbb;
            margin-bottom: 150px;
        }

        .scroll-trigger {
            text-align: center;
            color: #444;
            font-size: 14px;
            letter-spacing: 2px;
            margin: 100px 0;
        }

        /* ーーー 最凶のジャンプスケア用スタイル ーーー */
       #jumpscare-screen {
            display: none; /* 初期は非表示 */
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 9999;
            background-color: #000;
        }

        /* 画面いっぱいに広がる恐怖画像 */
        .scare-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 画面に画像を強制フィットさせてドアップに */
        }

        /* 【修正】じわじわと不気味に揺れる和ホラーアニメーション */
        @keyframes curse-shake {
            0%   { transform: translate(0, 0) scale(1.05); }
            20%  { transform: translate(-4px, 5px) scale(1.05); filter: brightness(0.9); }
            40%  { transform: translate(6px, -3px) scale(1.08); }
            60%  { transform: translate(-5px, -5px) scale(1.05); filter: brightness(1.1); }
            80%  { transform: translate(4px, 4px) scale(1.1); }
            100% { transform: translate(0, 0) scale(1.05); }
        }
        
        .curse-active {
            /* 0.3秒周期で滑らかかつ不規則に揺れ動く */
            animation: curse-shake 0.3s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="us-header">
            <h1>CASE: 03 【 THE EVIL 】</h1>
            <div class="area-tag">USA / HORROR NO.3</div>
        </div>

        <div class="work-box">
            【 ここにアメリカエリアの作品画像 】
        </div>

        <div class="story-text">
            <p>最後となるアメリカエリアへようこそ。</p>
            <p>1980年代、とある地方都市の廃墟で発見された未解決事件の遺品。このエリアの展示物は、すべて当時の凄惨な現場を再現して作られています。</p>
            <p>凄まじい悪霊のエネルギーが未だに残っているため、体調に異変を感じた方は、すぐに目を逸らして通路の出口へ向かってください。</p>
        </div>

        <div class="scroll-trigger">
            ▼ MORE DETAILS (スクロールして詳細を展開)

        </div>

        <div style="height: 30vh;"></div>
    </div>

    <div id="jumpscare-screen">
        <img class="scare-image" src="https://images.unsplash.com/photo-1509248961158-e54f6934749c?q=80&w=600" alt="CURSE">
    </div>

    <audio id="curse-scream" src="jp_scream.mp3" preload="auto"></audio>

    <script>
        let isScared = false;
        const scareScreen = document.getElementById('jumpscare-screen');
        const screamSound = document.getElementById('curse-scream');

        window.addEventListener('scroll', function() {
            let maxScroll = document.body.offsetHeight - window.innerHeight;
            let currentScroll = window.scrollY;

            // 作品紹介を読んで、少し下に進んだ瞬間（全体の35%）にノーモーションで暴発！
            if (currentScroll > maxScroll * 0.35) {
                if (!isScared) {
                    isScared = true;
                    executeJumpScare();
                }
            }
        });

        function executeJumpScare() {
            // ジャンプスケア画面を表示し、ガタガタの画面呪いエフェクトをかける
            scareScreen.style.display = 'block';
            scareScreen.classList.add('curse-active');

            // 大音量で音声を再生
            screamSound.volume = 1.0;
            screamSound.play().catch(e => console.log("Audio play blocked"));

            // スマホのバイブレーション（心臓が激しく波打つような痙攣振動）
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 500, 50, 500, 50, 1500]);
            }
        }
    </script>
</body>
</html>
